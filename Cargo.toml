# Virtual workspace root. Everything MCU-specific lives under boards/; build a
# board from inside its directory so its .cargo/config.toml applies.
[workspace]
resolver = "3"
members = ["kolibri-core", "boards/*"]
# A bare `cargo build` at the root builds the portable crate for the host.
default-members = ["kolibri-core"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.95"
license      = "Apache-2.0"
repository   = "https://github.com/marc/kolibri"

# Shared crates only; a board's HAL stays in that board's manifest.
[workspace.dependencies]
kolibri-core = { path = "kolibri-core" }

# No arch/platform features here; each board enables its own.
embassy-executor = "0.10"
embassy-time     = "0.5"
embassy-sync     = "0.8"
embassy-futures  = "0.1"

embedded-hal           = "1.0"
embedded-hal-async     = "1.0"
embedded-graphics      = "0.8"
embedded-storage       = "0.3"
oled_async             = "0.2.1"
display-interface      = "0.5"
display-interface-i2c  = "0.5.0"

log = "0.4"

[profile.dev]
opt-level = "s"

[profile.release]
opt-level     = "s"
lto           = "fat"
codegen-units = 1
# Stays in the ELF, not in flash; needed by probe-rs and esp-backtrace.
debug         = 2

[workspace.lints.rust]
unsafe_code      = "warn"
missing_docs     = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
