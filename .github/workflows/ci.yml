name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; no job here needs to write to the repo.
permissions:
  contents: read

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Firmware artifacts are the point of this workflow; keep the ELF debuggable.
  CARGO_INCREMENTAL: 0

jobs:
  core:
    name: portable core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Check formatting
        run: cargo fmt --all --check

      # Built for the host, deliberately: kolibri-core is supposed to compile
      # without any HAL, and the cheapest way to keep that true is to build it
      # somewhere no HAL could possibly be linked. If someone reaches for
      # esp-hal in the portable crate, this step is what fails.
      - name: Clippy (host target)
        run: cargo clippy -p kolibri-core --all-features -- -D warnings

  board:
    name: ${{ matrix.board }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The size report is posted as a pull request comment.
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One entry per directory under boards/. `chip` is what espflash
          # needs to assemble the flashable image.
          - board: xiao-esp32c3
            chip: esp32c3
            target: riscv32imc-unknown-none-elf
    steps:
      - uses: actions/checkout@v4

      # Reads rust-toolchain.toml, so the channel and every board target come
      # from a single source of truth shared with local development. Includes
      # its own cargo cache.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # This action exports RUSTFLAGS=-D warnings by default, and the
          # RUSTFLAGS environment variable *replaces* the rustflags in the
          # board's .cargo/config.toml rather than merging with them. That
          # drops -Tlinkall.x and the release build fails to link with
          # undefined _stack_start, _dram_data_start and friends. Clippy still
          # gets -D warnings from its own step below.
          rustflags: ""

      # Every board step runs from inside the board directory: that is how
      # Cargo picks up its .cargo/config.toml, and with it the target triple
      # and the linker flags.
      - name: Clippy
        working-directory: boards/${{ matrix.board }}
        run: cargo clippy --all-features -- -D warnings

      - name: Build (release)
        working-directory: boards/${{ matrix.board }}
        run: cargo build --release

      - name: Install espflash
        uses: taiki-e/install-action@v2
        with:
          tool: espflash

      # --merge produces a single image flashable at offset 0x0 (bootloader +
      # partition table + app). --skip-padding keeps the artifact ~195 KB
      # instead of padding out to the full 4 MB flash size. The binary is named
      # `kolibri` regardless of board (see the board's [[bin]] section), and the
      # workspace shares one target/ directory at the repository root.
      - name: Build flashable image
        run: |
          espflash save-image \
            target/${{ matrix.target }}/release/kolibri \
            --chip ${{ matrix.chip }} \
            --merge \
            --skip-padding \
            firmware.bin

      # Neither number is visible anywhere else: cargo prints nothing about
      # size, and the ELF is mostly debug info. The report is derived from the
      # ELF's own sections and the linker's memory.x, so it cannot drift.
      - name: Measure flash and RAM usage
        run: |
          python3 tools/fw-size.py \
            target/${{ matrix.target }}/release/kolibri \
            --chip ${{ matrix.chip }} \
            --image firmware.bin \
            --label ${{ matrix.board }} \
            --format markdown \
            --marker '<!-- kolibri-size-report:${{ matrix.board }} -->' \
            --out size-report.md >> "$GITHUB_STEP_SUMMARY"

      # One comment per board, rewritten in place on every push rather than
      # added to, so the PR carries the sizes of the head commit and not a
      # transcript of every commit before it. Skipped for pull requests from
      # forks, where GITHUB_TOKEN is read-only: the report is still in the job
      # summary and the artifact.
      - name: Post the size report to the pull request
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          MARKER: '<!-- kolibri-size-report:${{ matrix.board }} -->'
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --paginate \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              -F body=@size-report.md
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              -F body=@size-report.md
          fi

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: |
            firmware.bin
            size-report.md
            target/${{ matrix.target }}/release/kolibri
          if-no-files-found: error

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
