[package]
name        = "kolibri-xiao-esp32c3"
description = "kolibri firmware for the Seeed Studio XIAO ESP32-C3"
keywords    = ["esp32c3", "embassy", "embedded", "xiao", "no-std"]
categories  = ["embedded", "no-std"]
readme      = "../../README.md"
publish     = false

version      .workspace = true
edition      .workspace = true
rust-version .workspace = true
license      .workspace = true
repository   .workspace = true

# Same binary name on every board; .vscode/launch.json relies on it.
[[bin]]
name = "kolibri"
path = "src/main.rs"

[dependencies]
kolibri-core = { workspace = true }

# The esp-* crates are a matched set (esp-rtos 0.4 needs esp-hal ~1.2 and
# embassy-sync ^0.8); bump them together. `unstable` gates esp_hal::timer.
esp-hal = { version = "1.2.0", features = ["esp32c3", "unstable", "log-04"] }
# Replaces the retired esp-hal-embassy: time driver and executor.
esp-rtos = { version = "0.4.0", features = ["esp32c3", "embassy", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = [
  "esp32c3",
  "embedded-storage",
] }
# Only here to re-enable its `critical-section` feature, which esp-bootloader
# turns off: without it a flash write runs with interrupts on and can fault.
esp-storage = { version = "0.10.0", features = ["esp32c3"] }
esp-println = { version = "0.18.0", features = ["esp32c3", "log-04"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32c3",
  "panic-handler",
  "println",
] }

# No arch-*/platform-* features: esp-rtos supplies the port.
embassy-executor = { workspace = true }
embassy-time     = { workspace = true }

log = { workspace = true }

[lints]
workspace = true
