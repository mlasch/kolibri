# Applies only when building from inside boards/xiao-esp32c3.
[build]
target = "riscv32imc-unknown-none-elf"

[target.riscv32imc-unknown-none-elf]
runner = "espflash flash --monitor"
rustflags = [
  "-C", "link-arg=-Tlinkall.x",
  # Needed for esp-backtrace to unwind on panic.
  "-C", "force-frame-pointers",
]

[env]
# Override per run, e.g. `ESP_LOG=debug cargo run`.
ESP_LOG = "info"
