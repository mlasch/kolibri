[package]
name        = "kolibri-core"
description = "MCU-independent half of the kolibri firmware: tasks, drawing, and the sensor abstraction"
keywords    = ["embassy", "embedded", "no-std", "embedded-graphics", "oled"]
categories  = ["embedded", "no-std"]
readme      = "../README.md"
publish     = false

version      .workspace = true
edition      .workspace = true
rust-version .workspace = true
license      .workspace = true
repository   .workspace = true

# Nothing here may depend on a HAL; a host build at the workspace root checks that.
[dependencies]
embassy-time    = { workspace = true }
embassy-sync    = { workspace = true }
embassy-futures = { workspace = true }

embedded-hal       = { workspace = true }
embedded-hal-async = { workspace = true }

embedded-graphics = { workspace = true }
embedded-storage = { workspace = true }
# Not `ssd1306`: the SH1106 has no horizontal addressing mode, so its flush
# must re-send the page address per page, which only `oled_async` does.
oled_async = { workspace = true }
display-interface = { workspace = true }
display-interface-i2c = { workspace = true }

log = { workspace = true }

[lints]
workspace = true
